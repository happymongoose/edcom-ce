server {
    listen       80;
    listen  [::]:80;
    server_name  _;

    # Cohort publication/pause/resume can legitimately exceed 60s at volume.
    # Keep this bounded and leave unrelated API timeouts unchanged. Clients
    # must still use publication receipts after an uncertain response.
    location ~ ^/api/automations/[^/]+/(publish|publish-impact|pause|resume)$ {
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
        proxy_pass http://api:8000;
    }

    location /api/ {
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_pass   http://api:8000;
    }

    location /signup/ {
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_pass   http://api:8000;
    }

    location = /l {
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_pass   http://api:8000;
    }

    location / {
        root   /usr/share/nginx/html;
        index  index.html;
        try_files $uri /index.html;
    }
}